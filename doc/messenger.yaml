framework:
  messenger:
    buses:
      messenger.bus.default:
        middleware:
          # Stamps dispatched messages with the current trace.
          - Msstc4Symfony\TracingBundle\Framework\Messenger\OutgoingTraceMiddleware
          # Restores the sender's trace for consumed messages and drops it afterwards.
          - Msstc4Symfony\TracingBundle\Framework\Messenger\IncomingTraceMiddleware
