deptrac:
    paths:
        - ./src

    layers:
        - name: Domain
          collectors:
              - type: directory
                value: src/Domain/(Entity|Document|ValueObject|Enum|Event|Repository|DocumentRepository)/.*

        - name: DomainService
          collectors:
              - type: directory
                value: src/Domain/(Service|Helper|Specification)/.*

        - name: Application
          collectors:
              - type: directory
                value: src/Application/.*

        - name: Infrastructure
          collectors:
              - type: directory
                value: src/Infrastructure/.*

        - name: Presentation
          collectors:
              - type: directory
                value: src/Presentation/.*

        - name: Framework
          collectors:
              - type: directory
                value: src/Framework/.*

        - name: DependencyInjection
          collectors:
              - type: directory
                value: src/DependencyInjection/.*

        - name: BundleRoot
          collectors:
              - type: classLike
                value: '^Msstc4Symfony\\TracingBundle\\TracingBundle$'

    ruleset:
        # W3C traceparent, tracestate, baggage and the trace context of a unit of work.
        Domain: ~

        # The trace context holder port and this service's caller name.
        Application:
            - Domain

        # In-memory holder, HttpClient decorator and Guzzle middleware.
        Infrastructure:
            - Domain
            - Application

        # Messenger middleware and stamp, Monolog processor, Sentry integration.
        Framework:
            - Domain
            - Application

        # HTTP kernel and console listeners.
        Presentation:
            - Domain
            - Application

        # Passes wire the HttpClient decorator and the Guzzle middleware.
        DependencyInjection:
            - Application
            - Infrastructure

        BundleRoot:
            - DependencyInjection
